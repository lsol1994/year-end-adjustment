  <style>
    html, body {
      font-family: "Pretendard Variable", Pretendard, Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F4F6F9;
      color: #0F172A;
      -webkit-tap-highlight-color: transparent;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    [hidden] { display: none !important; }

    @keyframes pulseBlue {
      0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.45); }
      70% { box-shadow: 0 0 0 8px rgba(37, 99, 235, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
    }
    .pulse-blue { animation: pulseBlue 2s infinite; }

    @keyframes pulseRose {
      0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.45); }
      70% { box-shadow: 0 0 0 8px rgba(225, 29, 72, 0); }
      100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
    }
    .pulse-rose { animation: pulseRose 1.8s infinite; }

    @keyframes shakeBox {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }
    .shake-highlight { animation: shakeBox 0.36s ease-in-out; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .drop-active {
      border-color: #2563EB !important;
      background-color: #EFF6FF !important;
    }
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    .pre-line { white-space: pre-line; }
    .safe-bottom { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)); }
    /* 표 머리 고정 */
    .tbl-scroll { max-height: 70vh; overflow: auto; }
    .tbl-scroll thead th { position: sticky; top: 0; z-index: 1; }
    /* 날짜 입력칸이 iOS에서 찌그러지지 않게 */
    input[type="date"] { min-height: 46px; }
  </style>
</head>

async function pwHash(id, pw){

  const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);

}

/* ---------- 이미지 처리: HEIC→JPG 변환(가능한 기기) + 큰 사진 압축 ---------- */
async function prepareImage(file){
  const type = mimeOf(file);
  const isHeic = type === 'image/heic' || type === 'image/heif';
  if (!isHeic && file.size < 1.2 * 1048576) return file;
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    if (!b || (!isHeic && b.size >= file.size)) return file;
    return new File([b], (file.name || '사진').replace(/\.[^.]+$/, '') + '.jpg', {type:'image/jpeg'});
  } catch { return file; } // 변환 못하는 기기(PC 크롬의 HEIC 등)는 원본 그대로
}

function normBirth(v){
  if (v == null || v === '') return '';
  if (v instanceof Date) return `${String(v.getFullYear()).slice(2)}${String(v.getMonth()+1).padStart(2,'0')}${String(v.getDate()).padStart(2,'0')}`;
  if (typeof v === 'number') {
    if (v > 10000 && v < 80000 && window.XLSX) {           // 엑셀 날짜 일련번호
      const d = XLSX.SSF.parse_date_code(v);
      return `${String(d.y).slice(2)}${String(d.m).padStart(2,'0')}${String(d.d).padStart(2,'0')}`;
    }
    v = String(Math.round(v));
  }
  let d = digits(v);
  if (d.length === 13 || d.length === 7) d = d.slice(0,6);  // 주민번호가 들어있으면 앞 6자리만 사용
  if (d.length === 5) d = '0' + d;                          // 2000년대생 앞자리 0이 빠진 경우
  if (d.length === 8) d = d.slice(2);                       // 19900101
  return /^\d{6}$/.test(d) ? d : '';
}
function normPhone(v){
  let d = digits(typeof v === 'number' ? Math.round(v) : v);
  if (d.length === 10 && d.startsWith('10')) d = '0' + d;   // 엑셀이 앞자리 0을 지운 경우
  return /^01\d{8,9}$/.test(d) ? d : '';
}
function parseRosterSheet(aoa){
  // 순서 중요: '소속법인' 같은 제목이 법인으로 먼저 잡히도록 corp 를 먼저 검사
  const COLS = [['corp',/법인|회사명/],['empNo',/사번|사원번호|직원번호|이카운트|ecount/i],['dept',/소속|근무지|부서|현장|사업장/],['name',/이름|성명/],['birth',/생년월일|생일|주민/],['phone',/연락처|전화|휴대|핸드폰|폰번호/]];
  let hr = -1, map = {};
  for (let i = 0; i < Math.min(15, aoa.length); i++) {
    const m = {};
    (aoa[i] || []).forEach((c, j) => { const s = String(c ?? ''); for (const [k, re] of COLS) if (m[k] == null && re.test(s)) { m[k] = j; break; } });
    if (m.name != null && m.birth != null) { hr = i; map = m; break; }
  }
  if (hr < 0) throw new Error('제목 행을 못 찾았어요. 첫 줄에 "법인, 사번, 소속, 이름, 생년월일, 연락처" 제목을 넣어주세요.');
  const missing = ['corp','empNo','dept'].filter(k => map[k] == null).map(k => ({corp:'법인',empNo:'사번',dept:'소속'}[k]));
  if (missing.length) throw new Error(`"${missing.join(', ')}" 열이 없어요.`);
  const rows = [];
  for (let i = hr + 1; i < aoa.length; i++) {
    const r = aoa[i] || [];
    const raw = { corp: r[map.corp], empNo: r[map.empNo], dept: r[map.dept], name: r[map.name], birth: r[map.birth], phone: map.phone != null ? r[map.phone] : '' };
    if (!Object.values(raw).some(v => String(v ?? '').trim())) continue;
    const row = { line: i + 1, corp: normCorp(raw.corp), empNo: normEmpNo(raw.empNo), dept: normDept(raw.dept), name: normName(raw.name), birth: normBirth(raw.birth), phone: normPhone(raw.phone), errs: [] };
    if (!row.corp) row.errs.push(`법인명 확인(${String(raw.corp ?? '') || '빈칸'})`);
    if (!validEmpNo(row.empNo)) row.errs.push(`사번 확인(${row.empNo || '빈칸'})`);
    if (!row.dept) row.errs.push('소속 없음');
    if (row.name.length < 2) row.errs.push('이름 확인');
    if (!row.birth) row.errs.push(`생년월일 형식(${String(raw.birth ?? '')})`);
    if (String(raw.phone ?? '').trim() && !row.phone) row.errs.push(`연락처 형식(${String(raw.phone)})`);
    rows.push(row);
  }
  return rows;
}
async function finalizeRoster(rows){
  const seen = new Map();
  for (const r of rows) {
    if (r.errs.length) continue;
    r.key = acctId(r.corp, r.empNo);
    if (seen.has(r.key)) r.errs.push(`${seen.get(r.key)}행과 사번 중복`); else seen.set(r.key, r.line);
  }
  return rows;
}
/* 법인별 소속 목록 {법인: [소속...]} */
function corpDeptMap(rows){
  const m = {};
  for (const r of rows) (m[r.corp] ||= new Set()).add(r.dept);
  const out = {};
  for (const c of Object.keys(m).sort(corpOrder)) out[c] = [...m[c]].sort((a,b) => a.localeCompare(b,'ko'));
  return out;
}

  const auth = A.getAuth(app), db = F.getFirestore(app), st = S.getStorage(app);
  await auth.authStateReady();
  const snapList = snap => snap.docs.map(d => ({id:d.id, ...d.data()}));
  const batchRun = async ops => { for (let i = 0; i < ops.length; i += 450) { const b = F.writeBatch(db); ops.slice(i, i+450).forEach(fn => fn(b)); await b.commit(); } };
  const anon = async () => {
    if (auth.currentUser && !auth.currentUser.isAnonymous) await A.signOut(auth);
    if (!auth.currentUser) await A.signInAnonymously(auth);
    return auth.currentUser.uid;
  };
  const acctOf = async id => { const d = await F.getDoc(F.doc(db, COL.accounts, id)); return d.exists() ? {id, ...d.data()} : null; };
  return {
    mode:'firebase',
    /* ---- 직원 ---- */
    async employeeLogin(id, hash){
      const uid = await anon();
      try { await F.setDoc(F.doc(db, COL.sessions, uid), {account: id, pwHash: hash, at: Date.now()}); }
      catch (e) { if (e.code === 'permission-denied') return null; throw e; }   // 사번·비밀번호 불일치
      return acctOf(id);
    },
    async restoreSession(){
      const u = auth.currentUser; if (!u || !u.isAnonymous) return null;
      try {
        const s = await F.getDoc(F.doc(db, COL.sessions, u.uid)); if (!s.exists()) return null;
        const a = await acctOf(s.data().account);
        return a && a.pwHash === s.data().pwHash ? a : null;
      } catch { return null; }
    },
    async changePassword(id, newHash){
      await F.updateDoc(F.doc(db, COL.accounts, id), {pwHash: newHash, mustChange: false, pwChangedAt: Date.now()});
      await F.setDoc(F.doc(db, COL.sessions, auth.currentUser.uid), {account: id, pwHash: newHash, at: Date.now()});
    },
    async employeeLogout(){
      const u = auth.currentUser;
      if (u && u.isAnonymous) { try { await F.deleteDoc(F.doc(db, COL.sessions, u.uid)); } catch {} }
      await A.signOut(auth);
    },
    upload(meta, blob, onProg){
      return new Promise((res, rej) => {
        const path = `${STORAGE_ROOT}/${meta.year}/${meta.empKey}/${Date.now()}_${safeName(meta.fileName)}`;
        const task = S.uploadBytesResumable(S.ref(st, path), blob, {contentType: meta.contentType});
        task.on('state_changed', s => onProg(s.bytesTransferred / s.totalBytes), rej, async () => {
          try {
            const rec = {...meta, path, size: blob.size, createdAt: Date.now()};
            const d = await F.addDoc(F.collection(db, COL.uploads), rec);
            res({...rec, id: d.id});
          } catch (e) { rej(e); }
        });
      });
    },
    // 관리자가 근로자 대신 올리기 (받은 자료 올리기). 경로·기록 형식은 직원 업로드와 같음
    adminUpload(meta, blob, onProg){ return this.upload(meta, blob, onProg); },
    async myUploads(key, year){
      return snapList(await F.getDocs(F.query(F.collection(db,COL.uploads), F.where('empKey','==',key), F.where('year','==',year))));
    },
    async remove(rec){
      try { await S.deleteObject(S.ref(st, rec.path)); } catch (e) { if (e.code !== 'storage/object-not-found') throw e; }
      await F.deleteDoc(F.doc(db, COL.uploads, rec.id));
    },
    async saveSubmission(id, data){ await F.setDoc(F.doc(db, COL.subs, id), data, {merge:true}); },
    // 본인 제출 기록(문답표) 읽기. 보안규칙이 막으면 null (이 기기 저장본을 씀)
    async mySubmission(id){ const d = await F.getDoc(F.doc(db, COL.subs, id)); return d.exists() ? d.data() : null; }, // [26_11_23_03] 읽기 실패는 throw (없음과 구별)
    /* ---- 관리자 ---- */
    async adminSignIn(){
      if (auth.currentUser) await A.signOut(auth);
      const p = new A.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
      return (await A.signInWithPopup(auth, p)).user;
    },
    async adminSignOut(){ await A.signOut(auth); },
    adminUser(){ const u = auth.currentUser; return u && !u.isAnonymous ? u : null; },
    // 관리자 여부는 서버(보안규칙)가 판단: 관리자만 읽을 수 있는 설정 문서를 읽어봄
    async isAdmin(){ try { await F.getDoc(F.doc(db, COL.config, 'settings')); return true; } catch { return false; } },
    async getSettings(){ const d = await F.getDoc(F.doc(db, COL.config, 'settings')); return d.exists() ? d.data() : {}; },
    async saveSettings(data){ await F.setDoc(F.doc(db, COL.config, 'settings'), {...data, updatedAt: Date.now()}, {merge:true}); },
    async listAdmins(){ return snapList(await F.getDocs(F.collection(db, COL.admins))); },
    async addAdmin(email, by){ await F.setDoc(F.doc(db, COL.admins, email), {addedBy: by, addedAt: Date.now()}); },
    async removeAdmin(email){ await F.deleteDoc(F.doc(db, COL.admins, email)); },
    async adminUploads(year){ return snapList(await F.getDocs(F.query(F.collection(db,COL.uploads), F.where('year','==',year)))); },
    async adminSubs(year){ return snapList(await F.getDocs(F.query(F.collection(db,COL.subs), F.where('year','==',year)))); },
    async getRoster(){ return snapList(await F.getDocs(F.collection(db, COL.accounts))).map(a => ({...a, key: a.id})); },
    async saveRoster(rows, initialPw, onProg){
      const old = snapList(await F.getDocs(F.collection(db, COL.accounts)));
      const oldIds = new Set(old.map(o => o.id)), newIds = new Set(rows.map(r => r.key));
      const ops = old.filter(o => !newIds.has(o.id)).map(o => b => b.delete(F.doc(db, COL.accounts, o.id)));
      let n = 0; const fresh = rows.filter(r => !oldIds.has(r.key));
      for (const r of rows) {
        const prof = {corp:r.corp, empNo:r.empNo, dept:r.dept, name:r.name, birth:r.birth, phone:r.phone || '', year: CONFIG.year};
        if (oldIds.has(r.key)) ops.push(b => b.set(F.doc(db, COL.accounts, r.key), prof, {merge:true}));   // 비밀번호는 그대로 둠
        else { const h = await pwHash(r.key, initialPw); onProg && onProg(++n, fresh.length);
               ops.push(b => b.set(F.doc(db, COL.accounts, r.key), {...prof, pwHash: h, mustChange: true, createdAt: Date.now()})); }
      }
      await batchRun(ops);
    },
    async resetPassword(id, initialPw){
      await F.updateDoc(F.doc(db, COL.accounts, id), {pwHash: await pwHash(id, initialPw), mustChange: true, resetAt: Date.now()});
    },
    // [26_11_23_01] 근로자 초기화: 올린 서류(파일+기록) → 제출 기록(문답표·메모·동의·제출완료) 삭제
    //   → 계정에 dataResetAt 표시(직원 기기에 남은 문답표 사본도 다음 로그인 때 지움) → 그 근로자 로그인 끊기
    async resetEmployee({files, subs, keys}, onProg){
      let n = 0; const total = files.length + subs.length;
      for (const f of files) { await this.remove(f); onProg && onProg(++n, total); }
      for (const s of subs) { await F.deleteDoc(F.doc(db, COL.subs, s.id || `${s.year}_${s.empKey}`)); onProg && onProg(++n, total); }
      const at = Date.now();
      for (const k of keys) {
        await F.updateDoc(F.doc(db, COL.accounts, k), {dataResetAt: at});
        try { const ss = await F.getDocs(F.query(F.collection(db, COL.sessions), F.where('account', '==', k))); await Promise.all(ss.docs.map(d => F.deleteDoc(d.ref))); }
        catch (e) { console.warn('로그인 끊기 실패(무시)', e); }
      }
      return at;
    },
    // [26_11_23_05] 종이 원본 받음 표시 (계정 문서에 기록, 명단 다시 올려도 유지)
    async setPaper(id, on, by){ const d = on ? {paperAt: Date.now(), paperBy: by || ''} : {paperAt: null, paperBy: null}; await F.updateDoc(F.doc(db, COL.accounts, id), d); return d; },
    async fileBlob(rec){ return S.getBlob(S.ref(st, rec.path)); },
  };
}

async function makeDemo(){
  const uploads = [], subs = {}, blobs = {}; let accounts = {}, admin = null, session = null, admins = [], settings = {initialPw: '0000'};
  const sample = [['씨앤에이','1001','본사','홍길동','900101','01012345678'],['씨앤에이','1002','강남지점','김영희','850315','01098765432'],['씨앤에이비즈','1001','본사','이철수','780720','01055556666']];
  for (const [corp,empNo,dept,name,birth,phone] of sample) { const id = acctId(corp, empNo); accounts[id] = {id, corp, empNo, dept, name, birth, phone, year: CONFIG.year, pwHash: await pwHash(id, settings.initialPw), mustChange: true}; }
  const subsAll = subs;
  return {
    mode:'demo', sample,
    async employeeLogin(id, hash){ const a = accounts[id]; if (!a || a.pwHash !== hash) return null; session = {account:id, pwHash:hash}; return {...a}; },
    async restoreSession(){ const a = session && accounts[session.account]; return a && a.pwHash === session.pwHash ? {...a} : null; },
    async changePassword(id, h){ Object.assign(accounts[id], {pwHash:h, mustChange:false}); session = {account:id, pwHash:h}; },
    async employeeLogout(){ session = null; },
    upload(meta, blob, onProg){
      const a = session && accounts[session.account];
      if (!a || a.id !== meta.empKey || a.pwHash !== session.pwHash) return Promise.reject(new Error('로그인이 필요해요'));
      return this.put(meta, blob, onProg);
    },
    adminUpload(meta, blob, onProg){
      if (!admin) return Promise.reject(new Error('관리자 로그인이 필요해요'));
      return this.put(meta, blob, onProg);
    },
    put(meta, blob, onProg){
      return new Promise(res => { let p = 0; const t = setInterval(() => { p += .25; onProg(Math.min(p,1)); if (p >= 1) { clearInterval(t);
        const id = 'd' + Date.now() + Math.random().toString(36).slice(2,6); blobs[id] = blob;
        const rec = {...meta, id, path:'demo/'+id, size: blob.size, createdAt: Date.now()}; uploads.push(rec); res(rec); } }, 100); });
    },
    async myUploads(key, year){ return uploads.filter(u => u.empKey === key && u.year === year); },
    async remove(rec){ const i = uploads.findIndex(u => u.id === rec.id); if (i >= 0) uploads.splice(i,1); delete blobs[rec.id]; },
    async saveSubmission(id, data){ subs[id] = {...subs[id], ...data}; },
    async mySubmission(id){ return subs[id] ? {...subs[id]} : null; },
    async adminSignIn(){ admin = {email: 'demo-admin@example.com'}; return admin; },
    async adminSignOut(){ admin = null; },
    adminUser(){ return admin; },
    async isAdmin(){ return true; },
    async getSettings(){ return {...settings}; },
    async saveSettings(d){ Object.assign(settings, d); },
    async listAdmins(){ return admins.map(id => ({id})); },
    async addAdmin(email){ if (!admins.includes(email)) admins.push(email); },
    async removeAdmin(email){ admins = admins.filter(a => a !== email); },
    async adminUploads(year){ return uploads.filter(u => u.year === year); },
    async adminSubs(year){ return Object.values(subs).filter(s => s.year === year); },
    async getRoster(){ return Object.values(accounts).map(a => ({...a, key: a.id})); },
    async saveRoster(rows, initialPw, onProg){
      const next = {}; let n = 0; const fresh = rows.filter(r => !accounts[r.key]);
      for (const r of rows) {
        const prof = {id:r.key, corp:r.corp, empNo:r.empNo, dept:r.dept, name:r.name, birth:r.birth, phone:r.phone || '', year: CONFIG.year};
        next[r.key] = accounts[r.key] ? {...accounts[r.key], ...prof} : {...prof, pwHash: await pwHash(r.key, initialPw), mustChange: true};
        if (!accounts[r.key]) onProg && onProg(++n, fresh.length);
      }
      accounts = next;
    },
    async resetPassword(id, initialPw){ Object.assign(accounts[id], {pwHash: await pwHash(id, initialPw), mustChange: true}); },
    async resetEmployee({files, subs, keys}, onProg){
      let n = 0; const total = files.length + subs.length;
      for (const f of files) { await this.remove(f); onProg && onProg(++n, total); }
      for (const s of subs) { for (const [id, v] of Object.entries(subsAll)) if (v === s || (v.empKey === s.empKey && v.year === s.year)) delete subsAll[id]; onProg && onProg(++n, total); }
      const at = Date.now();
      for (const k of keys) { if (accounts[k]) accounts[k].dataResetAt = at; if (session && session.account === k) session = null; }
      return at;
    },
    async setPaper(id, on, by){ const d = on ? {paperAt: Date.now(), paperBy: by || ''} : {paperAt: null, paperBy: null}; if (accounts[id]) Object.assign(accounts[id], d); return d; },
    async fileBlob(rec){ return blobs[rec.id]; },
  };
}

  else if (t <= dDead) { const u = toDead <= 5;

  else s = {idx:4, pct:100, live:'전체 일정 종료', liveCls:'bg-emerald-50 text-emerald-700', desc:`${CONFIG.year}년 귀속 연말정산 서류 접수가 모두 마무리되었습니다.`, stage:'현재 위치: 모든 일정 완료'};

  if (toDead > 5) dd = [`최종 마감 ${ddFmt(toDead)}`, 'bg-blue-500/20 text-blue-200 border-blue-400/30'];

  else dd = [`${CONFIG.year}년 귀속 연말정산 종료`, 'bg-slate-500/30 text-slate-200 border-slate-400/30'];
  return {...s, t, dStart, toDead, urgentBar: toDead <= 5 && toDead >= 0, dd};
}
function timelineHtml(s){
  const rows = CONFIG.schedule.filter(r => r.date && r.at);
  return rows.map((item, idx) => {
    const dDiff = dayNum(item.at) - s.t;
    let st = 'upcoming';
    if (s.t < s.dStart) st = idx === 0 ? 'next' : 'upcoming';
    else if (idx < s.idx) st = 'done';
    else if (idx === s.idx) st = (item.strong && s.toDead <= 5) ? 'urgent' : 'active';
    const dot = st === 'done' ? `<div class="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center z-10 shrink-0 mt-1"><i data-lucide="check" class="w-3 h-3"></i></div>`
      : st === 'urgent' ? `<div class="w-5 h-5 rounded-full bg-rose-600 border-4 border-rose-100 pulse-rose z-10 shrink-0 mt-1"></div>`
      : st === 'active' ? `<div class="w-5 h-5 rounded-full bg-blue-600 border-4 border-blue-100 pulse-blue z-10 shrink-0 mt-1"></div>`
      : st === 'next' ? `<div class="w-5 h-5 rounded-full bg-[#0F172A] border-4 border-slate-200 z-10 shrink-0 mt-1"></div>`
      : `<div class="w-5 h-5 rounded-full bg-white border-2 ${item.strong ? 'border-rose-300' : 'border-slate-300'} z-10 shrink-0 mt-1"></div>`;
    const badge = st === 'done' ? `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-400">완료</span>`
      : st === 'urgent' ? `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-rose-600 text-white">마감 임박 · ${ddFmt(dDiff)}</span>`
      : st === 'active' ? `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-blue-600 text-white">현재 단계</span>`
      : st === 'next' ? `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-[#0F172A] text-white">${ddFmt(dDiff)}</span>`
      : (item.strong && dDiff > 0) ? `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-rose-50 text-rose-600">${ddFmt(dDiff)}</span>`
      : `<span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-slate-100 text-slate-400">진행 예정</span>`;
    const box = 'flex-1 min-w-0 p-3.5 rounded-2xl border transition ' + (st === 'urgent' ? 'bg-rose-50/70 border-rose-200' : st === 'active' ? 'bg-blue-50/60 border-blue-200' : st === 'next' ? 'bg-slate-50 border-slate-200/80' : 'bg-transparent border-transparent');
    const dateCls = item.strong ? 'text-rose-600 font-extrabold' : (st === 'done' ? 'text-slate-400 font-semibold' : 'text-slate-900 font-extrabold');
    const titleCls = st === 'done' ? 'text-slate-400 line-through' : 'text-slate-800 font-bold';
    const showDesc = idx === 0 || st === 'active' || st === 'urgent' || st === 'next';
    return `<div class="relative flex gap-3.5">
      ${idx < rows.length - 1 ? `<div class="absolute left-[9px] top-7 bottom-[-10px] w-[2px] ${st === 'done' ? 'bg-emerald-400' : 'bg-slate-200'}"></div>` : ''}
      ${dot}
      <div class="${box}">
        <div class="flex items-center justify-between gap-2 flex-wrap"><span class="text-[13px] ${dateCls}">${esc(item.date)}</span>${badge}</div>
        <p class="text-sm mt-0.5 ${titleCls}">${esc(item.label)}</p>
        ${showDesc && item.desc ? `<p class="text-xs text-slate-500 mt-1">${esc(item.desc)}</p>` : ''}
      </div>
    </div>`;
  }).join('');
}

async function enterAs(acct){
  E.acct = acct;
  E.profile = {id: acct.id, key: acct.id, corp: acct.corp, empNo: acct.empNo, dept: acct.dept, name: acct.name, birth: acct.birth, mustChange: !!acct.mustChange};
  E.uploads = await api.myUploads(acct.id, CONFIG.year);
  let sub = null; E.subErr = false;
  try { sub = await api.mySubmission(subId()); } catch (e) { console.error(e); E.subErr = true; }
  // [26_11_23_01] 담당자가 초기화했으면 이 기기에 남아 있던 문답표·메모·동의 사본도 지움
  const rAt = acct.dataResetAt || 0, rKey = `ye_reset_${CONFIG.year}_${acct.id}`;
  if (rAt && ls.get(rKey) !== rAt) {
    [svKey(), memoKey(), svSubKey(), `ye_sens_${CONFIG.year}_${acct.id}`].forEach(k => { try { localStorage.removeItem(k); } catch {} });
    ls.set(rKey, rAt);
  }
  if (sub && rAt && Math.max(sub.surveyAt || 0, sub.completedAt || 0) < rAt) sub = null;
  // [26_11_23_03] 문답표 제출 상태: 서버 기록 우선, 못 읽으면 이 기기 사본
  const lsSub = ls.get(svSubKey());
  const subAt = sub ? (sub.surveySubmitted ? (sub.surveySubmittedAt || sub.surveyAt || 1) : (sub.completed && sub.surveyDone ? (sub.completedAt || 1) : 0))
    : (lsSub && lsSub.at) || 0;
  E.svSub = subAt;
  E.svSaved = subAt ? svClean((sub ? sub.survey : lsSub.survey) || {}) : null;
  const draft = sub ? sub.surveyDraft : (subAt ? ls.get(svKey()) : null);
  if (subAt) { E.survey = svClean(draft || E.svSaved); E.svEdit = !!draft && JSON.stringify(svClean(draft)) !== JSON.stringify(E.svSaved); }
  else { E.survey = svClean((sub && sub.survey) || ls.get(svKey()) || {}); E.svEdit = false; }
  ls.set(svKey(), E.survey);
  if (subAt) ls.set(svSubKey(), {at: subAt, survey: E.svSaved});
  E.memo = (sub && sub.memo) || ls.get(memoKey()) || '';
  E.sensitive = !!((sub && sub.sensitiveConsent) || ls.get(`ye_sens_${CONFIG.year}_${acct.id}`));
  E.done = !!(sub && sub.completed);
  E.local = {};
  if (location.hash === '#submit') renderSubmit(); else location.hash = '#submit';
}

$('#change-pw-form').onsubmit = async e => {
  e.preventDefault();
  const id = E.profile.id, p0 = $('#input-cur-pw').value, p1 = $('#input-new-pw').value, p2 = $('#input-new-pw-confirm').value;
  const err = m => { const el = $('#pw-change-error'); el.textContent = m; el.classList.remove('hidden'); };
  if (!p0) return err('지금 비밀번호를 입력해 주세요.');
  if (p1.length < CONFIG.pwMinLen) return err(`새 비밀번호는 ${CONFIG.pwMinLen}자 이상이어야 해요.`);
  if (p1 !== p2) return err('새 비밀번호가 서로 달라요.');
  if (p0 === p1) return err('지금 비밀번호와 다른 비밀번호로 정해 주세요.');
  const btn = $('#btn-pw-save'); btn.disabled = true; btn.textContent = '변경 중…';
  try {
    const cur = await api.restoreSession();
    if (!cur || cur.pwHash !== await pwHash(id, p0)) { err('지금 비밀번호가 맞지 않아요.'); return; }

  try { await api.saveSubmission(subId(), {year: CONFIG.year, empKey: p.key, empNo: p.empNo, corp: p.corp, name: p.name, birth: p.birth, sensitiveConsent: on, sensitiveAt: Date.now()}); }

/* 문답에 맞는 서류 칸만 보여줌 (해당 없어도 이미 올린 파일이 있으면 보여서 지울 수 있게) */
function renderCats(){
  const box = $('#cats'); if (!box) return;
  const show = UPLOAD_CATS().filter(c => catActive(c, E.survey) || E.uploads.some(u => u.category === c.id) || Object.values(E.pending).some(p => p.cat === c.id));
  box.innerHTML = (svDone(E.survey) ? '' : '<div class="bg-amber-50 border border-amber-200/80 rounded-2xl px-4 py-3 text-xs sm:text-sm font-semibold text-amber-800">문답표를 다 답하면 필요한 서류가 더 나타날 수 있어요.</div>') + show.map(catCard).join('');
  box.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => openPicker('pick', b.dataset.pick));
  box.querySelectorAll('[data-cam]').forEach(b => b.onclick = () => openPicker('cam', b.dataset.cam));
  box.querySelectorAll('[data-sens]').forEach(c => c.onchange = () => setSensitive(c.checked));
  box.querySelectorAll('[data-locked]').forEach(z => z.onclick = () => {
    const b = z.closest('section').querySelector('.sens-box');
    b.classList.add('border-rose-400', 'bg-rose-50/60', 'shake-highlight'); setTimeout(() => b.classList.remove('shake-highlight'), 400);
    toast('먼저 민감정보(건강정보) 처리에 동의해 주세요.');
  });
  box.querySelectorAll('[data-dz]').forEach(z => {
    const cat = z.dataset.dz, ok = () => !(SENSITIVE.includes(cat) && !E.sensitive);
    z.ondragover = e => { e.preventDefault(); if (ok()) z.classList.add('drop-active'); };
    z.ondragleave = () => z.classList.remove('drop-active');
    z.ondrop = e => { e.preventDefault(); z.classList.remove('drop-active');
      if (!ok()) return toast('먼저 민감정보(건강정보) 처리에 동의해 주세요.');
      const fs = [...e.dataTransfer.files]; if (fs.length) handleFiles(cat, fs); };
  });
  show.forEach(c => renderCatFiles(c.id));
}

function updateSummary(){
  if (!$('#sum')) return;
  const {req, have} = reqStatus();
  const n = E.uploads.length, pend = Object.keys(E.pending).filter(k => !E.pending[k].err).length;
  $('#sum').textContent = `문답표 ${E.svSub ? (E.svEdit ? '수정 중' : '제출함') : svDone(E.survey) ? '제출 전' : '작성 중'} · 필요한 서류 ${have.length}/${req.length} · 올린 파일 ${n}개`;
  $('#sum-req').textContent = `${have.length}/${req.length}`;
  $('#bar').style.width = (req.length ? have.length / req.length * 100 : 100) + '%';
  document.querySelectorAll('.sum-total').forEach(el => el.textContent = pend ? `업로드 중 ${pend}개…` : `파일 ${n}개 업로드됨`);
  document.querySelectorAll('[data-submit]').forEach(b => b.disabled = pend > 0 || n === 0);
  const pill = $('#st-pill');
  const [t, cls] = E.done ? ['제출 완료', 'bg-emerald-50 text-emerald-700'] : n ? ['진행중', 'bg-blue-50 text-blue-700'] : ['미제출', 'bg-slate-100 text-slate-500'];
  pill.textContent = t; pill.className = `text-xs font-bold px-2.5 py-0.5 rounded-full ${cls}`;
}

function renderCatFiles(cat){
  const box = $('#cat-' + cat); if (!box) return;
  const mine = E.uploads.filter(u => u.category === cat).sort((a,b) => a.createdAt - b.createdAt);
  const pend = Object.entries(E.pending).filter(([,p]) => p.cat === cat);
  const badge = box.querySelector('.cat-badge');
  badge.textContent = mine.length ? `제출됨 ${mine.length}개` : '미제출';
  badge.className = `cat-badge shrink-0 text-xs font-bold px-2.5 py-0.5 rounded-full ${mine.length ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-500'}`;
  box.classList.toggle('border-emerald-200', mine.length > 0);
  box.querySelector('.files').innerHTML =
    mine.map(u => `<div class="flex items-center justify-between gap-2.5 bg-slate-50 border border-slate-200/80 rounded-xl px-3.5 py-2.5">
        <div class="flex items-center gap-2.5 min-w-0"><i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-600 shrink-0"></i>
          <div class="min-w-0"><p class="text-xs sm:text-sm font-bold text-slate-800 truncate">${esc(u.fileName)}</p><p class="text-[11px] text-slate-400">${fmtSize(u.size)} · ${fmtTime(u.createdAt)}${u.by === 'admin' ? ' · 담당자가 대신 올림' : ''}</p></div></div>
        <div class="flex items-center gap-1.5 shrink-0">
          ${E.local[u.id] ? `<button type="button" data-see="${esc(u.id)}" class="text-xs font-bold text-blue-700 hover:bg-blue-50 px-2 py-1 rounded-lg transition">보기</button>` : ''}
          <button type="button" data-del="${esc(u.id)}" class="text-xs font-bold text-rose-600 hover:bg-rose-50 px-2 py-1 rounded-lg transition">삭제</button>
        </div></div>`).join('') +
    pend.map(([k,p]) => p.err
      ? `<div class="flex items-center justify-between gap-2.5 bg-rose-50 border border-rose-200 rounded-xl px-3.5 py-2.5 text-rose-700">
          <div class="flex items-center gap-2.5 min-w-0"><i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i><p class="text-xs sm:text-sm font-bold truncate">${esc(p.name)} — ${esc(p.err)}</p></div>
          <button type="button" data-dismiss="${k}" class="text-xs font-bold px-2 py-1 rounded-lg hover:bg-rose-100 shrink-0">닫기</button></div>`
      : `<div class="flex items-center gap-2.5 bg-slate-50 border border-slate-200/80 rounded-xl px-3.5 py-2.5">
          <i data-lucide="loader-2" class="w-4 h-4 text-blue-600 animate-spin shrink-0"></i>
          <p class="flex-1 min-w-0 text-xs sm:text-sm font-bold text-slate-700 truncate">${esc(p.name)}</p>
          <div class="w-20 h-1.5 bg-slate-200 rounded-full overflow-hidden shrink-0"><div id="pg-${k}" class="h-full bg-blue-600" style="width:${Math.round(p.p*100)}%"></div></div></div>`).join('');
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteMine(b.dataset.del));
  box.querySelectorAll('[data-see]').forEach(b => b.onclick = () => { const u = E.uploads.find(x => x.id === b.dataset.see); openPreview(u.fileName, catLabel(u.category) + ' · ' + fmtSize(u.size), E.local[u.id]); });
  box.querySelectorAll('[data-dismiss]').forEach(b => b.onclick = () => { delete E.pending[b.dataset.dismiss]; renderCatFiles(cat); updateSummary(); });
  icons();
}

/* 파일 미리보기 (이 기기에서 방금 올린 파일만. 서버 파일은 관리자만 열 수 있음) */
function openPreview(name, sub, blob){
  $('#preview-modal-title').textContent = name; $('#preview-modal-sub').textContent = sub;
  const body = $('#preview-modal-body'), url = URL.createObjectURL(blob);
  body.innerHTML = /^image\/(jpeg|png)/.test(blob.type)
    ? `<img src="${url}" alt="${esc(name)}" class="max-w-full max-h-[65vh] rounded-xl shadow-md object-contain">`
    : `<div class="text-center py-8 space-y-3"><div class="w-16 h-16 rounded-2xl bg-rose-100 text-rose-600 font-extrabold flex items-center justify-center mx-auto text-lg">${blob.type === 'application/pdf' ? 'PDF' : 'FILE'}</div>
        <p class="text-sm font-bold text-slate-800 break-all">${esc(name)}</p><p class="text-xs text-slate-500">새 창에서 열어 확인할 수 있어요.</p>
        <a href="${url}" target="_blank" rel="noopener" class="inline-block bg-blue-700 hover:bg-blue-800 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition">새 창에서 열기</a></div>`;
  $('#preview-modal').classList.remove('hidden');
  setTimeout(() => URL.revokeObjectURL(url), 120000);
}

let curCat = null;
function openPicker(which, cat){ curCat = cat; const el = $('#' + which); el.value = ''; el.click(); }
['pick','cam'].forEach(id => $('#' + id).addEventListener('change', e => {
  const files = [...e.target.files]; if (files.length && curCat) handleFiles(curCat, files);
}));

async function handleFiles(cat, files){
  if (SENSITIVE.includes(cat) && !E.sensitive) return toast('먼저 민감정보(건강정보) 처리에 동의해 주세요.');
  const bad = files.filter(f => !isAllowed(f));
  if (bad.length) toast(`올릴 수 없는 형식: ${bad.map(f => f.name).join(', ')} (PDF·JPG·PNG·HEIC만 가능)`);
  for (const f of files.filter(isAllowed)) {
    const k = 'p' + Date.now() + Math.random().toString(36).slice(2,6);
    E.pending[k] = {cat, name: f.name || '사진.jpg', p: 0};
    renderCatFiles(cat); updateSummary();
    try {
      const blob = mimeOf(f).startsWith('image/') ? await prepareImage(f) : f;
      if (blob.size > CONFIG.maxFileMB * 1048576) throw new Error(`${CONFIG.maxFileMB}MB 초과`);
      const fileName = blob.name || f.name || `촬영_${Date.now()}.jpg`;
      const contentType = mimeOf(blob.name ? blob : f);
      const rec = await api.upload({
        year: CONFIG.year, empKey: E.profile.key, empNo: E.profile.empNo, name: E.profile.name, birth: E.profile.birth, corp: E.profile.corp, dept: E.profile.dept,
        category: cat, fileName, contentType,
      }, blob, p => { E.pending[k].p = p; const bar = $('#pg-' + k); if (bar) bar.style.width = Math.round(p*100) + '%'; });
      delete E.pending[k]; E.uploads.push(rec);
      E.local[rec.id] = blob.type ? blob : new Blob([blob], {type: contentType});
      toast(`${catLabel(cat)} 올렸어요`);
    } catch (e) {
      console.error(e);
      E.pending[k].err = e.code === 'storage/unauthorized' ? '권한 오류' : (e.message || '실패');
      toast('업로드 실패: ' + E.pending[k].err);
    }
    renderCatFiles(cat); updateSummary();
  }
}

async function deleteMine(id){
  const rec = E.uploads.find(u => u.id === id); if (!rec) return;
  if (!confirm(`"${rec.fileName}" 파일을 삭제할까요?`)) return;
  try { await api.remove(rec); E.uploads = E.uploads.filter(u => u.id !== id); delete E.local[id]; renderCatFiles(rec.category); updateSummary(); toast('파일이 삭제되었어요.', '🗑️'); }
  catch (e) { toast('삭제 실패: ' + (e.code || e.message)); }
}

async function submitAll(){
  if (E.svSub && E.svEdit && JSON.stringify(svClean(E.survey)) !== JSON.stringify(E.svSaved)) {
    toast('고친 문답표를 먼저 [다시 제출]하거나 [수정 취소]해 주세요');
    $('#survey').scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  if (!svDone(E.survey)) {
    toast('문답표를 끝까지 답해 주세요');
    const q = svQuestions(E.survey).find(q => !svValid(q, E.survey[q.id]));
    if (q) $('#q-' + q.id).scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  const warns = svWarns(E.survey);
  if (warns.length && !confirm(`문답표에 공제 요건이 안 맞는 항목이 있어요:\n· ${warns.map(q => q.short).join('\n· ')}\n\n그래도 제출할까요? (담당자가 확인 후 연락드려요)`)) return;
  const {missing} = reqStatus();
  if (missing.length && !confirm(`필수 서류가 빠져 있어요:\n· ${missing.map(m => m.label).join('\n· ')}\n\n그래도 제출할까요? (나중에 추가로 올릴 수 있어요)`)) return;
  const btns = [...document.querySelectorAll('[data-submit]')]; btns.forEach(b => { b.disabled = true; b.textContent = '제출 중…'; });
  try {
    clearTimeout(svTimer);
    await api.saveSubmission(subId(), {
      year: CONFIG.year, empKey: E.profile.key, empNo: E.profile.empNo, corp: E.profile.corp, name: E.profile.name, birth: E.profile.birth, memo: ($('#memo').value || '').trim(),
      survey: E.survey, surveyDone: true, surveyAt: Date.now(), surveySubmitted: true, surveySubmittedAt: E.svSub || Date.now(), surveyDraft: null, surveyDraftAt: null,
      completed: true, completedAt: Date.now(), fileCount: E.uploads.length,
      missingRequired: missing.map(m => m.id), sensitiveConsent: E.sensitive,
    });
    E.done = true; E.lastMissing = missing;
    if (!E.svSub) E.svSub = Date.now();
    E.svSaved = svClean(E.survey); E.svEdit = false; ls.set(svSubKey(), {at: E.svSub, survey: E.svSaved});
    toast('서류 제출이 완료되었어요!');
    go('#done');
  } catch (e) { console.error(e); toast('제출 실패: ' + (e.code || e.message)); btns.forEach(b => { b.disabled = false; b.textContent = '제출 완료'; }); }
}

const AD = { uploads: [], subs: [], roster: [], admins: [], settings: {}, me: '', tab: 'status', q: '', corp: '', dept: '', st: '', open: new Set(), sel: new Set(), rq: '', rcorp: '', rdept: '', preview: null };

        <button type="button" id="login" class="mt-5 w-full flex items-center justify-between gap-3 px-4 py-3.5 rounded-2xl border border-slate-200 hover:border-blue-400 hover:bg-blue-50/40 transition text-left">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-8 h-8 rounded-full bg-white border border-slate-200 flex items-center justify-center shrink-0 shadow-sm [&>svg]:w-[18px] [&>svg]:h-[18px]">${ICON.google}</div>
            <div class="min-w-0"><p class="text-sm font-bold text-slate-900">Google 계정으로 로그인</p><p class="text-[11px] text-slate-500">${api.mode === 'demo' ? '데모: 누르면 바로 들어가요' : '팝업이 열리면 계정을 골라 주세요'}</p></div>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 shrink-0"></i>
        </button>
        <div class="mt-6 pt-4 border-t border-slate-100 text-center">

    try { await api.adminSignIn(); await loadAdmin(); toast('관리자로 로그인되었어요.'); }
    catch (e) {
      const MSG = {
        'auth/popup-blocked': '팝업이 차단됐어요. 브라우저 주소창에서 팝업을 허용하고 다시 눌러주세요.',

        'auth/network-request-failed': '인터넷 연결을 확인해 주세요.',
        'auth/operation-not-supported-in-this-environment': '이 브라우저(카카오톡 등 앱 안 브라우저)에서는 로그인이 안 돼요. 크롬이나 사파리로 열어주세요.',

async function loadAdmin(){
  const u = api.adminUser();
  if (!u) return renderAdminLogin();
  if (!(await api.isAdmin())) { await api.adminSignOut(); return renderAdminLogin(`${u.email} 은(는) 관리자로 등록되지 않은 계정이에요.`); }
  AD.me = u.email;
  app.innerHTML = `<div class="min-h-screen flex items-center justify-center text-sm text-slate-400">불러오는 중…</div>`;
  try {

function people(){
  const by = new Map();
  for (const r of AD.roster) by.set(r.key, {...r, files:[], last:0, inRoster:true});
  // 명단에서 연락처·소속이 바뀌면 키가 달라지므로, 법인+이름+생년월일이 같은 사람(1명일 때만)에게 이어 붙임
  const ident = new Map();
  for (const r of AD.roster) { const k = `${r.corp}|${r.name}|${r.birth}`; ident.set(k, ident.has(k) ? null : r.key); }
  for (const u of AD.uploads) {
    let k = u.empKey, moved = false;
    if (!by.has(k) && u.birth) { const m = ident.get(`${u.corp}|${u.name}|${u.birth}`); if (m) { k = m; moved = true; } }
    if (!by.has(k)) by.set(k, {key:k, corp:u.corp || '', empNo:u.empNo || '', dept:u.dept, name:u.name, birth:u.birth || '', phone:'', files:[], last:0, inRoster:false});
    const p = by.get(k); p.files.push(moved ? {...u, moved:true} : u); p.last = Math.max(p.last, u.createdAt || 0);
  }
  for (const s of AD.subs) {
    let k = s.empKey;
    if (!by.has(k) && s.birth) k = ident.get(`${s.corp}|${s.name}|${s.birth}`) || k;
    if (by.has(k)) { const p = by.get(k); if (!p.sub || (s.completedAt || 0) > (p.sub.completedAt || 0)) p.sub = s; }
  }
  for (const p of by.values()) p.status = !p.inRoster ? 'out' : p.sub?.completed ? 'done' : (p.files.length || p.sub?.surveySubmitted) ? 'prog' : 'none'; // [26_11_23_03] 문답표만 제출해도 진행중
  return [...by.values()].sort((a,b) => corpOrder(a.corp, b.corp) || a.dept.localeCompare(b.dept,'ko') || a.name.localeCompare(b.name,'ko'));
}

// 입력 중인 칸(검색칸)은 그대로 두고 나머지만 새로 그림. 칸을 새로 만들면 한글 조합이 끊겨서 자음·모음이 따로 쳐짐.
function setHtmlKeep(box, html, keepId){
  const live = box.querySelector('#'+keepId);
  if (!live || document.activeElement !== live) { box.innerHTML = html; return; }
  const t = document.createElement('template'); t.innerHTML = html;
  const fresh = t.content.querySelector('#'+keepId);
  const depth = (n, top) => { let d = 0; while (n && n !== top) { n = n.parentNode; d++; } return n === top ? d : -1; };
  if (!fresh || depth(live, box) !== depth(fresh, t.content)) { box.innerHTML = html; return; }
  let l = live, f = fresh;
  while (l !== box) {
    const lp = l.parentNode, fp = f.parentNode, fk = [...fp.childNodes], i = fk.indexOf(f);
    [...lp.childNodes].forEach(n => n !== l && n.remove());
    l.before(...fk.slice(0, i)); l.after(...fk.slice(i + 1));
    if (lp !== box) { [...lp.attributes].forEach(a => fp.hasAttribute(a.name) || lp.removeAttribute(a.name)); [...fp.attributes].forEach(a => lp.setAttribute(a.name, a.value)); }
    l = lp; f = fp;
  }
}

      const blob = await api.fileBlob(f);

/* ---------- 근로자 초기화 (26_11_23_01) ----------
   시험으로 넣은 문답표·서류 등을 한 번에 지우고 처음 상태로 되돌림. 명단 정보와 비밀번호는 그대로 둠 */
function wipeTargets(p){
  const inR = k => AD.roster.some(r => r.key === k);
  const same = s => s.corp === p.corp && s.name === p.name && s.birth === p.birth;
  const subs = AD.subs.filter(s => s.year === CONFIG.year && (s.empKey === p.key || (!inR(s.empKey) && same(s))));
  const files = p.files.slice();
  const keys = [...new Set([p.key, ...files.map(f => f.empKey), ...subs.map(s => s.empKey)])].filter(inR);
  return {files, subs, keys};
}
function openWipeModal(p){
  const t = wipeTargets(p), sv = p.sub?.survey;
  const svTxt = !t.subs.length ? '없음' : !sv ? '제출 기록만 있음' : svDone(sv) ? '작성 완료' : '작성 중';
  const byAdmin = t.files.filter(f => f.by === 'admin').length;
  const m = document.createElement('div');
  m.id = 'wipe-modal'; m.className = 'fixed inset-0 z-50 flex items-center justify-center p-4';
  m.innerHTML = `<div class="absolute inset-0 bg-slate-900/50 backdrop-blur-[2px]" data-wipe-x></div>
    <div class="relative w-full max-w-md bg-white rounded-3xl p-6 shadow-2xl">
      <div class="flex items-center gap-2.5 mb-1"><span class="w-9 h-9 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center shrink-0"><i data-lucide="alert-triangle" class="w-5 h-5"></i></span>
        <h3 class="text-lg font-extrabold text-slate-900">근로자 초기화</h3></div>
      <p class="text-xs text-slate-500 mb-4">${esc(p.corp)} · 사번 ${esc(p.empNo || '-')} · ${esc(p.name)}${p.dept ? ' (' + esc(p.dept) + ')' : ''}</p>
      <div class="rounded-2xl border border-rose-200 bg-rose-50/70 px-4 py-3.5 text-xs sm:text-sm text-rose-800 leading-relaxed">
        <p class="font-extrabold">이 근로자가 작성·제출한 내용이 모두 지워지고 처음 상태로 돌아가요. 되돌릴 수 없어요.</p>
        <ul class="mt-2 space-y-1 list-disc list-inside font-medium">
          <li>문답표 답변: <strong>${svTxt}</strong></li>
          <li>올린 서류: <strong>${t.files.length}개</strong>${byAdmin ? ` (담당자가 올린 ${byAdmin}개 포함)` : ''} — 파일까지 삭제</li>
          <li>메모, 민감정보(건강정보) 동의, 제출 완료 상태</li>
          <li>지금 로그인돼 있으면 로그아웃돼요</li>
        </ul>
      </div>
      <p class="text-[11.5px] text-slate-500 mt-3">근로자 명단 정보와 비밀번호는 그대로예요. 필요한 서류는 미리 [열기]로 받아 두세요.</p>
      <label class="flex items-start gap-2 mt-4 text-xs sm:text-sm font-bold text-slate-700 cursor-pointer">
        <input id="wipe-ok" type="checkbox" class="w-4 h-4 mt-0.5 rounded border-slate-300 text-rose-600">되돌릴 수 없다는 걸 확인했어요. ${esc(p.name)}님 자료를 초기화할게요.</label>
      <p id="wipe-st" class="text-xs font-semibold text-slate-500 mt-2 empty:hidden"></p>
      <div class="flex gap-2 mt-5">
        <button type="button" data-wipe-x class="flex-1 text-sm font-bold py-3 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700">취소</button>
        <button type="button" id="wipe-go" disabled style="opacity:.5" class="flex-1 text-sm font-bold py-3 rounded-xl bg-rose-600 hover:bg-rose-700 text-white transition">초기화</button>
      </div>
    </div>`;
  document.body.appendChild(m); icons();
  let busy = false;
  const close = () => { if (!busy) m.remove(); };
  m.querySelectorAll('[data-wipe-x]').forEach(x => x.onclick = close);
  const ok = $('#wipe-ok'), go = $('#wipe-go');
  ok.onchange = () => { go.disabled = !ok.checked; go.style.opacity = ok.checked ? '' : '.5'; };
  go.onclick = async () => {
    if (!ok.checked || busy) return;
    busy = true; go.disabled = true; ok.disabled = true; go.textContent = '초기화 중…';
    const st = $('#wipe-st');
    try {
      await api.resetEmployee(t, (n, total) => { st.textContent = `지우는 중… ${n}/${total}`; });
      const fIds = new Set(t.files.map(f => f.id));
      AD.uploads = AD.uploads.filter(u => !fIds.has(u.id));
      AD.subs = AD.subs.filter(s => !t.subs.includes(s));
      // [26_11_23_02] 초기화 후에는 상세를 접고 선택도 풀어서 다른 근로자와 같은 한 줄 모양으로
      [p.key, ...t.keys].forEach(k => { AD.open.delete(k); AD.sel.delete(k); });
      busy = false; m.remove(); renderAdmin();
      toast(`${p.name}님 자료를 초기화했어요 (서류 ${t.files.length}개 삭제)`, '🧹');
    } catch (e) {
      console.error(e); busy = false;
      st.className = 'text-xs font-bold text-rose-600 mt-2'; st.textContent = '초기화 실패: ' + (e.code || e.message) + ' — 새로고침 후 남은 내용을 확인하고 다시 해 주세요.';
      go.textContent = '다시 시도'; go.disabled = false; ok.disabled = false;
      try { await loadAdmin(); } catch {}
    }
  };
}

async function addOne(){
  const corp = $('#a-corp').value, empNo = normEmpNo($('#a-emp').value), dept = normDept($('#a-dept').value), name = normName($('#a-name').value), birth = $('#a-birth').value, phone = normPhone($('#a-phone').value);
  if (!validEmpNo(empNo)) return toast('사번을 확인해 주세요 (영문·숫자)');
  if (!dept) return toast('소속을 입력해 주세요');
  if (name.length < 2) return toast('이름을 입력해 주세요');
  if (!/^\d{6}$/.test(birth)) return toast('생년월일 6자리를 입력해 주세요');
  if ($('#a-phone').value.trim() && !phone) return toast('연락처를 확인해 주세요');
  const key = acctId(corp, empNo);
  if (AD.roster.some(r => r.key === key)) return toast(`${corp}에 사번 ${empNo}은(는) 이미 있어요`);
  if (!AD.roster.some(r => r.corp === corp && r.dept === dept) && !confirm(`${corp}에 "${dept}"은(는) 새 소속이에요. 추가할까요?`)) return;
  await saveRosterRows([...AD.roster, {corp, empNo, dept, name, birth, phone, key}], `${name}님이 명단에 추가되었어요 (임시 비밀번호)`);
}

async function saveRosterRows(rows, msg){
  const ipw = AD.settings.initialPw;
  const isNew = rows.some(r => !AD.roster.some(o => o.key === r.key));
  if (isNew && !ipw) return toast('임시 비밀번호를 먼저 정해 주세요');
  try {
    await api.saveRoster(rows, ipw, (n, m) => toast(`새 직원 비밀번호 준비 중 ${n}/${m}`, '⏳'));
    AD.roster = await api.getRoster(); toast(msg); renderAdmin();
  } catch (e) { console.error(e); toast('저장 실패: ' + (e.code || e.message)); }
}

async function readExcel(file){
  if (!window.XLSX) return toast('엑셀 라이브러리를 불러오지 못했어요. 새로고침 해주세요');
  try {
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
    const rows = await finalizeRoster(parseRosterSheet(aoa));
    if (!rows.length) return toast('읽을 수 있는 근로자 행이 없어요');
    AD.preview = {file: file.name, rows, showOk: false};
    renderRosterTab();
  } catch (e) { console.error(e); toast(e.message || '엑셀을 읽지 못했어요'); }
}

/* 엑셀 저장: 생년월일·연락처는 글자로 저장해서 앞자리 0이 안 사라지게 */
function saveXlsx(aoa, sheet, file, widths){
  if (!window.XLSX) return toast('엑셀 라이브러리를 불러오지 못했어요');
  const ws = XLSX.utils.aoa_to_sheet(aoa.map(r => r.map(v => typeof v === 'number' ? v : String(v ?? ''))));
  if (widths) ws['!cols'] = widths.map(w => ({wch:w}));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, sheet);
  XLSX.writeFile(wb, file);
}
function saveXlsxSheets(sheets, file){
  if (!window.XLSX) return toast('엑셀 라이브러리를 불러오지 못했어요');
  const wb = XLSX.utils.book_new();
  for (const [name, aoa, widths] of sheets) {
    const ws = XLSX.utils.aoa_to_sheet(aoa.map(r => r.map(v => typeof v === 'number' ? v : String(v ?? ''))));
    if (widths) ws['!cols'] = widths.map(w => ({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws, name);
  }
  XLSX.writeFile(wb, file);
}
function exportCsv(ps){
  const cats = UPLOAD_CATS();
  const head = ['법인','사번','소속','이름','생년월일','연락처','상태','파일수','문답표','문답 「예」 항목','요건 확인 필요','없는 필요 서류', ...cats.map(c => c.label), '종이 원본', '메모'];

async function downloadZip(ps, zipName){
  if (!window.JSZip) return toast('ZIP 라이브러리를 불러오지 못했어요');
  const files = ps.flatMap(p => p.files.map(f => ({p, f})));
  const svPeople = ps.filter(p => p.sub?.survey).sort(empOrder);
  if (!files.length && !svPeople.length) return toast('다운로드할 파일이 없어요');
  const st = $('#zipst'); const zip = new JSZip(); let done = 0, fail = 0;
  const used = new Set(), clean = s => String(s || '미지정').replace(/[\\/:*?"<>|]/g,'');
  for (const {p, f} of files) {
    try {
      const blob = await api.fileBlob(f);
      let path = `${clean(p.corp)}/${clean(p.dept)}/${clean(p.empNo || '')}_${clean(p.name)}/${clean(catLabel(f.category))}/${f.fileName}`;
      let i = 1; while (used.has(path)) path = path.replace(/(\(\d+\))?(\.[^.]+)?$/, (m, a, ext) => `(${i++})${ext || ''}`);
      used.add(path); zip.file(path, blob);
    } catch (e) { console.error(e); fail++; }
    done++; if (st) st.textContent = `파일 받는 중 ${done}/${files.length}`;
  }
  // 직원별 문답표 PDF 자동 포함: 법인/소속/사번_이름/문답표/사번_이름_문답표.pdf
  if (svPeople.length) {
    try {
      const libs = await pdfLibs(); let n = 0;
      for (const p of svPeople) {
        const doc = new libs.jsPDF({unit:'mm', format:'a4'});
        await surveyPdfPages(doc, p, libs, true);
        const base = `${clean(p.empNo || '')}_${clean(p.name)}`;
        zip.file(`${clean(p.corp)}/${clean(p.dept)}/${base}/문답표/${base}_문답표.pdf`, doc.output('blob'));
        if (st) st.textContent = `문답표 PDF ${++n}/${svPeople.length}`;
      }
    } catch (e) { console.error(e); fail++; toast('문답표 PDF를 만들지 못했어요: ' + e.message); }
  }
  if (st) st.textContent = '압축 중…';
  saveBlob(await zip.generateAsync({type:'blob'}), zipName);
  if (st) st.textContent = fail ? `완료 (실패 ${fail}개 — CORS 설정 확인)` : '완료';
}

/* ---------- PC 폴더에 저장 (26_11_23_07) ----------
   PC Chrome·Edge의 폴더 선택(File System Access API)으로 한 번 고른 폴더에 ZIP과 같은 구조로 바로 저장:
   법인/소속/사번_이름/서류 종류/파일, 법인/소속/사번_이름/문답표/사번_이름_문답표.pdf
   고른 폴더는 이 브라우저(IndexedDB)에 기억. 폴더 맨 위 _저장기록.json으로 이미 저장한 파일은 건너뛰고,
   문답표는 내용이 바뀐 사람만 다시 저장. 사이트에서 지운 파일은 PC에서 지우지 않음. */
const PCFS = { key: () => `ye_pcdir_${CONFIG.year}`, log: '_저장기록.json', busy: false };
function pcIdb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('ye_fs', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('h');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function pcHandle(set){
  try {
    const db = await pcIdb();
    return await new Promise((res, rej) => {
      const tx = db.transaction('h', set === undefined ? 'readonly' : 'readwrite'), os = tx.objectStore('h');
      const r = set === undefined ? os.get(PCFS.key()) : (set ? os.put(set, PCFS.key()) : os.delete(PCFS.key()));
      r.onsuccess = () => res(set === undefined ? r.result || null : set); r.onerror = () => rej(r.error);
    });
  } catch (e) { console.error(e); return null; }
}
async function pcDirLine(){
  const el = $('#pcdir'); if (!el) return;
  if (!window.showDirectoryPicker) { el.textContent = ''; return; }
  const h = await pcHandle();
  if (!$('#pcdir')) return;
  el.innerHTML = h ? `PC 저장 폴더: <strong class="text-slate-700">${esc(h.name)}</strong> · <button type="button" id="pcpick" class="font-bold text-blue-700 underline">폴더 바꾸기</button>` : '';
  const b = $('#pcpick'); if (b) b.onclick = async () => { const n = await pcPickDir(); if (n) toast(`저장 폴더를 「${n.name}」(으)로 바꿨어요`); pcDirLine(); };
}
async function pcPickDir(){
  try {
    const h = await window.showDirectoryPicker({id: 'ye-pc', mode: 'readwrite'});
    await pcHandle(h); return h;
  } catch (e) {
    if (e && e.name === 'AbortError') return null;
    console.error(e); toast('폴더를 고를 수 없어요: ' + (e.message || e)); return null;
  }
}
async function pcPerm(h){
  if (!h.queryPermission) return true;
  const o = {mode: 'readwrite'};
  if (await h.queryPermission(o) === 'granted') return true;
  return (await h.requestPermission(o)) === 'granted';
}
async function pcDir(root, parts){ let d = root; for (const n of parts) d = await d.getDirectoryHandle(n, {create: true}); return d; }
async function pcExists(dir, name){ try { await dir.getFileHandle(name); return true; } catch { return false; } }
async function pcWrite(dir, name, blob){
  const fh = await dir.getFileHandle(name, {create: true});
  const w = await fh.createWritable(); await w.write(blob); await w.close();
}
async function pcReadLog(root){
  try { const f = await (await root.getFileHandle(PCFS.log)).getFile(); const j = JSON.parse(await f.text()); return {files: j.files || {}, surveys: j.surveys || {}}; }
  catch { return {files: {}, surveys: {}}; }
}
async function pcWriteLog(root, log){
  await pcWrite(root, PCFS.log, new Blob([JSON.stringify({v: 1, year: CONFIG.year, savedAt: new Date().toISOString(), ...log}, null, 1)], {type: 'application/json'}));
}
async function saveToPcFolder(ps){
  if (!window.showDirectoryPicker) return toast('이 브라우저는 PC 폴더 저장이 안 돼요. PC의 Chrome이나 Edge에서 써 주세요');
  if (PCFS.busy) return toast('지금 저장 중이에요. 끝나면 다시 눌러 주세요');
  const files = ps.flatMap(p => p.files.map(f => ({p, f})));
  const svPeople = ps.filter(p => p.sub?.survey).sort(empOrder);
  if (!files.length && !svPeople.length) return toast('저장할 파일이 없어요');
  let root = await pcHandle();
  try { if (root && !(await pcPerm(root))) root = null; } catch (e) { console.error(e); root = null; }
  if (!root) { root = await pcPickDir(); if (!root) return; if (!(await pcPerm(root))) return toast('폴더에 저장할 권한이 없어요. 다시 눌러서 허용해 주세요'); }
  pcDirLine();
  PCFS.busy = true;
  const st = $('#zipst'), btn = $('#pcsave'); if (btn) btn.disabled = true;
  const say = t => { const e = $('#zipst'); if (e) e.textContent = t; };
  const clean = s => String(s || '미지정').replace(/[\\/:*?"<>|]/g, '').replace(/[. ]+$/, '') || '미지정';
  const log = await pcReadLog(root);
  let saved = 0, skip = 0, fail = 0, svSaved = 0, svSkip = 0, n = 0;
  try {
    for (const {p, f} of files) {
      n++; say(`PC 폴더에 저장 중 ${n}/${files.length}`);
      try {
        const old = log.files[f.id];
        if (old) {
          const parts = old.split('/'), name = parts.pop();
          if (await pcExists(await pcDir(root, parts), name)) { skip++; continue; }
        }
        const parts = [clean(p.corp), clean(p.dept), `${clean(p.empNo || '')}_${clean(p.name)}`, clean(catLabel(f.category))];
        const dir = await pcDir(root, parts);
        const taken = new Set(Object.entries(log.files).filter(([k]) => k !== f.id).map(([, v]) => v));
        let name = clean(f.fileName), i = 1;
        while (taken.has([...parts, name].join('/')) || await pcExists(dir, name)) name = clean(f.fileName).replace(/(\.[^.]+)?$/, ext => `(${i++})${ext || ''}`);
        await pcWrite(dir, name, await api.fileBlob(f));
        log.files[f.id] = [...parts, name].join('/'); saved++;
        if (saved % 20 === 0) await pcWriteLog(root, log);
      } catch (e) { console.error(e); fail++; }
    }
    if (svPeople.length) {
      let libs = null, m = 0;
      for (const p of svPeople) {
        m++; say(`문답표 PDF 저장 중 ${m}/${svPeople.length}`);
        try {
          const sub = p.sub, stamp = [sub.surveyAt || 0, sub.surveySubmittedAt || 0, sub.surveySubmitted ? 1 : 0, (sub.memo || '').length].join('|');
          const base = `${clean(p.empNo || '')}_${clean(p.name)}`, parts = [clean(p.corp), clean(p.dept), base, '문답표'], name = `${base}_문답표.pdf`;
          const dir = await pcDir(root, parts), prev = log.surveys[p.key];
          if (prev && prev.stamp === stamp && prev.path === [...parts, name].join('/') && await pcExists(dir, name)) { svSkip++; continue; }
          libs = libs || await pdfLibs();
          const doc = new libs.jsPDF({unit: 'mm', format: 'a4'});
          await surveyPdfPages(doc, p, libs, true);
          await pcWrite(dir, name, doc.output('blob'));
          log.surveys[p.key] = {stamp, path: [...parts, name].join('/')}; svSaved++;
        } catch (e) { console.error(e); fail++; }
      }
    }
    await pcWriteLog(root, log);
    const msg = `「${root.name}」 폴더에 저장 완료 · 새 파일 ${saved}개, 문답표 ${svSaved}명` + (skip + svSkip ? ` · 이미 저장돼 있어 건너뜀 ${skip + svSkip}개` : '') + (fail ? ` · 실패 ${fail}개 (CORS·권한 확인)` : '');
    say(msg); toast(fail ? `저장했지만 실패 ${fail}개가 있어요` : 'PC 폴더에 저장했어요');
  } catch (e) { console.error(e); say(''); toast('PC 폴더 저장 실패: ' + (e.message || e)); }
  finally { PCFS.busy = false; const b = $('#pcsave'); if (b) b.disabled = false; }
}

  const need = ST_DOCS.filter(k => { const c = CATS.find(x => x.id === k); return c && catRequired(c, sv); });
  const v = {no, corp: p.corp, dept: p.dept, empNo: /^\d+$/.test(p.empNo || '') ? Number(p.empNo) : (p.empNo || ''), name: p.name, birth: birthDate(p.birth),
    status: ST_LABEL[p.status], doneAt: p.sub?.completed ? kstDate(p.sub.completedAt) : null,
    survey: !sv ? '미제출' : svDone(sv) ? '○' : '작성중', hometax: null,
    reqN: need.length, haveN: need.filter(k => have.has(k)).length, missing: need.filter(k => !have.has(k)).map(k => ST_NAME[k]).join(', '),
    warns: sv ? svWarns(sv).map(q => `${SECTION[q.sec].title.split('.')[0]}${q.no ? ' ' + q.no : ''} ${q.short}`).join(', ') : '', memo: p.sub?.memo || '', note: null};
  for (const k of ST_DOCS) v[k] = have.has(k) ? '○' : need.includes(k) ? '미제출' : '-';
  return v;
}
function statusSheet(wb, name, rows, title){
  const ws = wb.addWorksheet(name, {views: [{state: 'frozen', xSplit: 6, ySplit: 3, zoomScale: 100}],
    pageSetup: {orientation: 'landscape', paperSize: 9, fitToPage: true, fitToWidth: 1, fitToHeight: 0, printTitlesRow: '2:3'}});
  const n = ST_COLS.length, L = i => ws.getColumn(i).letter;
  const HF = {name: '맑은 고딕', size: 9, bold: true}, DF = {name: '맑은 고딕', size: 9};
  const B = {top: {style: 'thin', color: {argb: 'FF999999'}}, left: {style: 'thin', color: {argb: 'FF999999'}}, bottom: {style: 'thin', color: {argb: 'FF999999'}}, right: {style: 'thin', color: {argb: 'FF999999'}}};
  const C = {horizontal: 'center', vertical: 'middle', wrapText: true}, LT = {horizontal: 'left', vertical: 'middle', wrapText: true};
  ws.getCell(1, 1).value = title; ws.getCell(1, 1).font = {name: '맑은 고딕', size: 12, bold: true};
  ws.getCell(1, 12).value = '○ 제출   미제출 = 문답표상 필요한데 없음   - = 해당 없음   빈칸 = 사이트에서 알 수 없음(직접 확인)';
  ws.getCell(1, 12).font = {name: '맑은 고딕', size: 9, color: {argb: 'FF555555'}};
  for (let i = 1; i <= n; ) {
    const g = ST_COLS[i-1][0];
    if (!g) { ws.getCell(2, i).value = ST_COLS[i-1][1]; ws.mergeCells(2, i, 3, i); i++; continue; }
    let j = i; while (j < n && ST_COLS[j][0] === g) j++;
    ws.getCell(2, i).value = g; if (j > i) ws.mergeCells(2, i, 2, j);
    for (let k = i; k <= j; k++) ws.getCell(3, k).value = ST_COLS[k-1][1];
    i = j + 1;
  }
  for (const r of [2, 3]) for (let c = 1; c <= n; c++) { const x = ws.getCell(r, c); x.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FFFFFF99'}}; x.font = HF; x.alignment = C; x.border = B; }
  ws.getRow(1).height = 22; ws.getRow(2).height = 20; ws.getRow(3).height = 42;
  ST_COLS.forEach((c, i) => ws.getColumn(i + 1).width = c[2]);
  let r = 4;
  rows.forEach((p, i) => {
    const v = statusRow(p, i + 1);
    ST_COLS.forEach((c, j) => {
      const x = ws.getCell(r, j + 1), val = v[c[3]];
      x.value = val == null ? null : val; x.font = DF; x.border = B;
      x.alignment = ['missing','warns','memo','note'].includes(c[3]) ? LT : C;
      if ((c[3] === 'birth' || c[3] === 'doneAt') && val) x.numFmt = 'yyyy-mm-dd';
    });
    ws.getRow(r).height = 21.75; r++;
  });
  const last = r - 1;
  [['제출(○)', '○'], ['미제출', '미제출']].forEach(([label, crit], t) => {
    const rr = r + t;
    if (!t) { ws.getCell(rr, 2).value = '총계'; ws.getCell(rr, 5).value = `${rows.length}명`; }
    ws.getCell(rr, 6).value = label;
    ST_COLS.forEach((c, j) => {
      const x = ws.getCell(rr, j + 1);
      if (ST_DOCS.includes(c[3]) || c[3] === 'survey') x.value = last >= 4 ? {formula: `COUNTIF(${L(j+1)}4:${L(j+1)}${last},"${crit}")`} : 0;
      x.font = HF; x.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FFF2F2F2'}}; x.border = B; x.alignment = C;
    });
  });
  if (last >= 4) {
    const ref = `G4:${L(n)}${last}`;
    ws.addConditionalFormatting({ref, rules: [
      {type: 'cellIs', operator: 'equal', formulae: ['"미제출"'], priority: 1, style: {fill: {type: 'pattern', pattern: 'solid', bgColor: {argb: 'FFFDE2E2'}}, font: {color: {argb: 'FFC62828'}, bold: true}}},
      {type: 'cellIs', operator: 'equal', formulae: ['"○"'], priority: 2, style: {font: {color: {argb: 'FF1E8A5A'}, bold: true}}},
      {type: 'cellIs', operator: 'equal', formulae: ['"작성중"'], priority: 3, style: {font: {color: {argb: 'FFC2410C'}, bold: true}}},
      {type: 'cellIs', operator: 'equal', formulae: ['"-"'], priority: 4, style: {font: {color: {argb: 'FFBBBBBB'}}}},
    ]});
    ws.autoFilter = `A3:${L(n)}${last}`;
  }
}

async function pdfJsLib(){

async function pdfText(file){
  let lib; try { lib = await pdfJsLib(); } catch { return {err:'lib'}; }
  try {
    const doc = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false,
      cMapUrl: PDFJS + 'cmaps/', cMapPacked: true, standardFontDataUrl: PDFJS + 'standard_fonts/', disableFontFace: true}).promise;
    let text = ''; const n = Math.min(doc.numPages, 3);
    for (let i = 1; i <= n; i++) { const tc = await (await doc.getPage(i)).getTextContent(); text += tc.items.map(x => x.str).join(' ') + '\n'; }
    const pages = doc.numPages; doc.destroy();
    return {text, pages};
  } catch (e) { return {err: e && e.name === 'PasswordException' ? 'pw' : 'read'}; }
}
async function fileHash(file){
  const b = await crypto.subtle.digest('SHA-256', await file.arrayBuffer());
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
}

/* 서류 종류: 파일·폴더 이름 → PDF 첫 부분 순서로 찾음 */
function ikGuessCat(path, text){
  const p = normName(path).replace(/\.[^.]+$/, '');
  for (const [id, re] of IK_RULES) if (re.test(p)) return {cat: id, why: '파일 이름', resident2: id === 'resident' && /초본/.test(p)};
  const head = normName(text || '').slice(0, 600);
  if (head) for (const [id, , re] of IK_RULES) if (re.test(head)) return {cat: id, why: 'PDF 내용', resident2: id === 'resident' && /초본/.test(head)};
  return {cat: '', why: ''};
}

/* 근로자: 파일·폴더 이름의 이름·사번·생년월일·법인·소속 + PDF 안의 이름·주민번호 앞자리로 점수 */
function ikGuessEmp(path, text){
  const R = AD.roster; if (!R.length) return {key:'', conf:'none', why:[], cands:[]};
  const P = normName(path), toks = new Set(path.split(/[^0-9A-Za-z]+/).filter(Boolean));
  const pBirth = new Set();
  for (const t of toks) { if (/^\d{6}$/.test(t)) pBirth.add(t); if (/^(19|20)\d{6}$/.test(t)) pBirth.add(t.slice(2)); }
  for (const m of path.matchAll(/(?:^|\D)(?:19|20)?(\d{2})[.\-_ ](\d{2})[.\-_ ](\d{2})(?!\d)/g)) pBirth.add(m[1] + m[2] + m[3]);
  const T = normName(text || ''), tBirth = new Set([...T.matchAll(/(\d{6})-[1-8*]/g)].map(m => m[1]));
  const pBiz = /씨앤에이비즈|비즈|cnabiz/i.test(P), pCna = !pBiz && /씨앤에이|cna/i.test(P);
  const first = (() => { let best = null, at = Infinity; for (const r of R) { const i = r.name && r.name.length >= 2 ? T.indexOf(r.name) : -1; if (i >= 0 && i < at) { at = i; best = r.name; } } return best; })();
  const cands = [];
  for (const r of R) {
    let s = 0; const why = []; let nameHit = false, empHit = false, birthHit = false, other = false;
    if (r.name && r.name.length >= 2 && P.includes(r.name)) { s += 3; nameHit = true; why.push('이름'); }
    else if (r.name && r.name.length >= 2 && T.includes(r.name)) { s += 2 + (first === r.name ? 1 : 0); nameHit = true; why.push('PDF 속 이름'); }
    if (r.empNo && toks.has(String(r.empNo))) { s += 3; empHit = true; why.push('사번'); }
    if (r.birth && pBirth.has(r.birth)) { s += 3; birthHit = true; why.push('생년월일'); }
    else if (r.birth && tBirth.has(r.birth)) { s += 3; birthHit = true; why.push('PDF 속 주민번호 앞자리'); }
    if (pBiz || pCna) { const ok = (pBiz && r.corp === '씨앤에이비즈') || (pCna && r.corp === '씨앤에이'); s += ok ? 1 : -3; if (ok) { other = true; why.push('법인'); } }
    if (r.dept && r.dept.length >= 2 && P.includes(normName(r.dept))) { s += 1; other = true; why.push('소속'); }
    if (nameHit || (empHit && (birthHit || other)) || (birthHit && other)) cands.push({key: r.key, s, why});
  }
  cands.sort((a,b) => b.s - a.s);
  const [a, b] = cands;
  if (!a) return {key:'', conf:'none', why:[], cands:[]};
  if (b && b.s === a.s) return {key:'', conf:'tie', why:[], cands: cands.filter(c => c.s === a.s).map(c => c.key)};
  // 확실: 점수 5 이상이고 2등과 3점 이상 차이, 또는 파일·폴더 이름의 이름과 맞는 사람이 딱 1명
  const conf = (a.s >= 5 && (!b || b.s <= a.s - 3)) || (!b && a.why.includes('이름')) ? 'high' : 'mid';
  return {key: a.key, conf, why: a.why, cands: cands.slice(0, 3).map(c => c.key)};
}

const ikEmp = key => AD.roster.find(r => r.key === key);

function ikDupOf(row){
  if (!row.key || !row.hash) return null;
  return AD.uploads.find(u => u.empKey === row.key && (u.sha256 === row.hash || (u.fileName === row.name && u.size === row.size)))
    || IK.rows.find(o => o !== row && o.key === row.key && o.hash === row.hash && (o.st === 'saved' || IK.rows.indexOf(o) < IK.rows.indexOf(row))) || null;
}
function ikState(r){
  if (r.st === 'saved') return ['saved', '저장됨'];
  if (r.st === 'saving') return ['saving', '저장 중'];
  if (r.err) return ['err', r.err];
  if (r.st === 'read') return ['read', '읽는 중'];
  if (!r.key) return ['need', r.conf === 'tie' ? '동명이인 — 골라 주세요' : '근로자 지정 필요'];
  if (!r.cat) return ['need', '서류 종류 지정 필요'];
  if (r.dup) return ['dup', '이미 올린 파일 같아요'];
  if (r.manual || IK.fixed) return ['ok', '지정함'];
  if (r.conf === 'high' && r.catWhy) return ['ok', '자동'];
  return ['chk', '확인해 주세요'];
}
const IK_TONE = {saved:'text-emerald-700 bg-emerald-50', saving:'text-blue-700 bg-blue-50', read:'text-slate-500 bg-slate-100', err:'text-rose-600 bg-rose-50', need:'text-orange-700 bg-orange-50', dup:'text-slate-600 bg-slate-200/70', ok:'text-emerald-700 bg-emerald-50', chk:'text-amber-800 bg-amber-50'};

function ikRefresh(r){
  if (r.st === 'saved' || r.err) return;
  if (!r.manual) r.key = IK.fixed || r.autoKey;
  r.dup = !!ikDupOf(r);
  if (r.dup && !r.dupSeen) { r.sel = false; r.dupSeen = true; }
}

/* 파일 모으기: 끌어다 놓은 폴더 안쪽까지 + ZIP 안 파일까지 */
async function ikCollectDrop(dt){
  const ents = [...(dt.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);   // await 전에 먼저 꺼내야 함
  if (!ents.length) return [...dt.files].map(f => ({file: f, path: f.name}));
  const out = [];
  const walk = async (e, dir) => {
    if (e.isFile) { const f = await new Promise((res, rej) => e.file(res, rej)); out.push({file: f, path: dir + f.name}); return; }
    if (!e.isDirectory) return;
    const rd = e.createReader(); let batch;
    do { batch = await new Promise((res, rej) => rd.readEntries(res, rej)); for (const c of batch) await walk(c, dir + e.name + '/'); } while (batch.length);
  };
  for (const e of ents) await walk(e, '');
  return out;
}
async function ikExpandZips(items){
  const out = [];
  for (const it of items) {
    if (extOf(it.file.name) !== 'zip') { out.push(it); continue; }
    if (!window.JSZip) { out.push({...it, bad: 'ZIP을 열 수 없어요'}); continue; }
    try {
      const zip = await JSZip.loadAsync(it.file, {decodeFileName: b => { const u = new Uint8Array(b); try { return new TextDecoder('utf-8', {fatal: true}).decode(u); } catch { return new TextDecoder('euc-kr').decode(u); } }});
      const base = it.path.replace(/\.zip$/i, '') + '/';
      for (const z of Object.values(zip.files)) {
        if (z.dir || IK_SKIP.test(z.name)) continue;
        const nm = z.name.split('/').pop(), ext = extOf(nm);
        const type = {pdf:'application/pdf', jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', heic:'image/heic', heif:'image/heif'}[ext] || '';
        out.push({file: new File([await z.async('blob')], nm, {type}), path: base + z.name});
      }
    } catch (e) { console.error(e); out.push({...it, bad: 'ZIP을 열 수 없어요 (암호가 걸렸거나 손상됨)'}); }
  }
  return out;
}

async function ikAdd(items){
  if (!AD.roster.length) return toast('근로자 명단을 먼저 등록해 주세요');
  items = (await ikExpandZips(items.filter(it => !IK_SKIP.test(it.path)))).filter(it => !IK_SKIP.test(it.path));
  if (!items.length) return toast('올릴 파일이 없어요');
  const added = items.map(it => ({id: 'k' + (++IK.seq), file: it.file, name: it.file.name, path: it.path || it.file.name, size: it.file.size,
    st: 'read', sel: false, key: '', autoKey: '', cat: '', why: [], catWhy: '', note: '', err: it.bad || '', p: 0}));
  IK.rows.push(...added); renderIntakeTab();
  for (const r of added) {
    if (r.err) { r.st = ''; continue; }
    try {
      if (!isAllowed(r.file)) { r.err = '올릴 수 없는 형식 (PDF·JPG·PNG·HEIC만)'; r.st = ''; continue; }
      if (r.size > CONFIG.maxFileMB * 1048576 && !mimeOf(r.file).startsWith('image/')) { r.err = `${CONFIG.maxFileMB}MB 초과`; r.st = ''; continue; }
      r.hash = await fileHash(r.file);
      let text = '';
      if (mimeOf(r.file) === 'application/pdf') {
        const t = await pdfText(r.file);
        if (t.err === 'pw') r.note = '암호 걸린 PDF — 내용은 못 읽고 파일 이름으로만 판단';
        else if (t.err === 'lib') r.note = 'PDF 읽기 기능을 못 불러와서 파일 이름으로만 판단';
        else if (t.err) r.note = 'PDF 내용을 못 읽어서 파일 이름으로만 판단';
        else { text = t.text; if (normName(text).length < 20) r.note = '글자가 없는 PDF(스캔본) — 파일 이름으로만 판단'; }
      }
      const e = ikGuessEmp(r.path, text), c = ikGuessCat(r.path, text);
      Object.assign(r, {autoKey: e.key, conf: e.conf, why: e.why, cands: e.cands, cat: c.cat || 'etc', catWhy: c.why});
      if (!c.cat) r.note = (r.note ? r.note + ' · ' : '') + '서류 종류를 못 찾아서 「기타 서류」로 둠';
      if (c.resident2) r.note = (r.note ? r.note + ' · ' : '') + '초본 같아요 — 등본(세대원 전원)이 필요해요';
      r.st = ''; ikRefresh(r); r.sel = !!r.key && !r.dup;
    } catch (err) { console.error(err); r.err = '파일을 읽지 못했어요'; r.st = ''; }
    finally { renderIntakeTab(); }
  }
  renderIntakeTab();
}

async function ikSave(){
  const todo = IK.rows.filter(r => r.sel && r.key && r.cat && !r.err && r.st !== 'saved');
  if (!todo.length) return toast('저장할 파일을 골라 주세요 (근로자·서류 종류가 정해진 줄만)');
  const who = new Set(todo.map(r => r.key)).size;
  if (!confirm(`${who}명에게 파일 ${todo.length}개를 저장할까요?\n저장하면 근로자 화면의 해당 서류 칸에도 보여요.`)) return;
  IK.busy = true; let ok = 0, fail = 0;
  for (const r of todo) {
    const p = ikEmp(r.key); if (!p) { r.err = '명단에 없는 근로자'; fail++; continue; }
    r.st = 'saving'; r.p = 0; renderIntakeTab();
    try {
      const blob = mimeOf(r.file).startsWith('image/') ? await prepareImage(r.file) : r.file;
      if (blob.size > CONFIG.maxFileMB * 1048576) throw new Error(`${CONFIG.maxFileMB}MB 초과`);
      const fileName = blob.name || r.name, contentType = mimeOf(blob.name ? blob : r.file);
      const rec = await api.adminUpload({
        year: CONFIG.year, empKey: p.key, empNo: p.empNo, name: p.name, birth: p.birth, corp: p.corp, dept: p.dept,
        category: r.cat, fileName, contentType, by: 'admin', byEmail: AD.me, srcPath: r.path.slice(-200), sha256: r.hash || '',
      }, blob, x => { r.p = x; const bar = $('#ikpg-' + r.id); if (bar) bar.style.width = Math.round(x * 100) + '%'; });
      AD.uploads.push(rec); r.st = 'saved'; r.sel = false; ok++;
    } catch (e) {
      console.error(e); r.st = ''; fail++;
      r.err = e.code === 'storage/unauthorized' || e.code === 'permission-denied' ? '권한 오류 (보안규칙 16 게시 필요)' : ('저장 실패: ' + (e.message || e.code));
    }
    renderIntakeTab();
  }
  IK.busy = false; IK.rows.forEach(ikRefresh); renderIntakeTab();
  toast(fail ? `${ok}개 저장, ${fail}개 실패` : `${who}명에게 ${ok}개 저장했어요`);
}

  <table class="qa"><thead><tr><th>내용</th><th>답</th><th>비고 (요건 확인)</th></tr></thead><tbody>${rows}</tbody></table>
  <p class="foot">본인 확인: ${sv.confirm ? '「위 내용이 사실과 같음을 확인합니다」에 체크함' : '체크 안 함'} · 연말정산 서류 제출 사이트에서 전자 작성</p>
  </div>`;
}
/* 한 사람 문답표를 A4에 그려 넣음 (길면 줄 단위로 끊어서 여러 장) */
async function surveyPdfPages(doc, p, libs, first){
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;background:#fff;z-index:-1';
  host.innerHTML = surveySheetHtml(p); document.body.appendChild(host);
  const el = host.firstElementChild;
  try {
    const canvas = await libs.h2c(el, {scale: 2, backgroundColor: '#ffffff', logging: false});
    const W = el.offsetWidth, total = el.offsetHeight, k = canvas.width / W, pageCss = W * 277 / 190;
    const top0 = el.getBoundingClientRect().top;
    const cuts = [...el.querySelectorAll('tr, table, h1, p')].map(n => n.getBoundingClientRect().bottom - top0);
    let start = 0, pageNo = 0;
    while (start < total - 1) {
      let end = start + pageCss;
      if (end < total) { const c = cuts.filter(b => b > start + 60 && b <= end); if (c.length) end = Math.max(...c); } else end = total;
      const sy = Math.round(start * k), sh = Math.min(canvas.height - sy, Math.round((end - start) * k));
      const part = document.createElement('canvas'); part.width = canvas.width; part.height = sh;
      part.getContext('2d').drawImage(canvas, 0, sy, canvas.width, sh, 0, 0, canvas.width, sh);
      if (!first || pageNo > 0) doc.addPage();
      doc.addImage(part.toDataURL('image/jpeg', 0.9), 'JPEG', 10, 10, 190, sh / k * 190 / W);
      start = end; pageNo++;
    }
  } finally { host.remove(); }
}
async function surveyPdfBlob(people, onProg){
  const libs = await pdfLibs();
  const doc = new libs.jsPDF({unit:'mm', format:'a4'});
  for (let i = 0; i < people.length; i++) { await surveyPdfPages(doc, people[i], libs, i === 0); onProg && onProg(i + 1, people.length); }
  return doc.output('blob');
}

function saveBlob(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* =====================================================================
   라우팅  (#  = 일정 홈 / #login / #submit / #done / #admin)
   ===================================================================== */
async function route(){
  const h = location.hash;
  $('#admin-preview-banner').classList.toggle('hidden', !(UI.preview && h !== '#admin'));
  window.scrollTo(0, 0);
  if (h === '#admin') {
    UI.preview = false; UI.sim = 'today'; $('#admin-preview-banner').classList.add('hidden');
    if (E.profile || E.acct) Object.assign(E, {profile: null, acct: null, uploads: [], survey: {}, local: {}});
    return api.adminUser() ? loadAdmin() : renderAdminLogin();
  }
  if (h === '#login') return (E.profile ? go('#submit') : renderLogin());
  if (h === '#submit') {
    if (E.profile) return renderSubmit();
    if (E.acct) { try { return await enterAs(E.acct); } catch (e) { console.error(e); E.acct = null; } }
    return go('#login');
  }
  if (h === '#done') return (E.profile && E.done ? renderDone() : go('#submit'));
  renderHome();
}

(async () => {
  detectDevice();
  // 실제 사이트(github.io)에서만 서버에 붙고, PC에서 파일을 바로 열거나 미리보기로 열면 자동으로 데모 모드 (?live 를 붙이면 강제로 실제 서버)
  const qs = new URLSearchParams(location.search);
  const demo = qs.has('demo') || (!qs.has('live') && !/(^|\.)github\.io$/.test(location.hostname));
  try { api = (CONFIG.firebase && !demo) ? await makeFirebase(CONFIG.firebase) : await makeDemo(); }
  catch (e) { console.error(e); app.innerHTML = `<div class="max-w-md mx-auto px-4 pt-10"><div class="bg-white rounded-3xl p-6 border border-slate-200 text-sm">서버 연결에 실패했어요. 잠시 후 다시 시도해 주세요.<br><span class="text-slate-400">${esc(e.message)}</span></div></div>`; return; }
  try { if (location.hash !== '#admin') E.acct = await api.restoreSession(); } catch (e) { console.error(e); }
  window.addEventListener('hashchange', route);
  route();
})();
